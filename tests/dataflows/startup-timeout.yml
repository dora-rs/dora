# `check_node_health` runs on `NodeHealthCheckInterval` ticks (default
# 5 s, binaries/daemon/src/lib.rs). Override to 0.1 s so the startup kill
# path fires quickly with the test's 0.5 s timeout.
health_check_interval: 0.1

nodes:
  - id: hang-before-init
    build: cargo build -p hang-before-init-node
    path: ../../target/debug/hang-before-init-node
    restart_policy: never
    startup_timeout: 0.5
    inputs:
      tick: dora/timer/millis/200
