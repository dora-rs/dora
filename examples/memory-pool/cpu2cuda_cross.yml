# CPU-to-GPU cross-machine throughput test.
# Sender (CPU) on machine A, receiver (GPU) on machine B.
nodes:
  - id: sender_node
    _unstable_deploy:
      machine: A
      working_dir: /data5/tangcanran/dora/examples/memory-pool
    build: pip install torch --extra-index-url https://download.pytorch.org/whl/cpu numpy
    path: sender.py
    inputs:
      next_require: receiver_node/next_require
    outputs:
      - data
    env:
      cross_machine: "B"
      sender_device: cpu
      receiver_device: cuda:0
      message_num: 100

  - id: receiver_node
    _unstable_deploy:
      machine: B
      working_dir: /data5/tangcanran/dora/examples/memory-pool
    build: pip install torch numpy tqdm
    path: receiver.py
    inputs:
      data: sender_node/data
    outputs:
      - next_require
    env:
      sender_device: cpu
      receiver_device: cuda:0
      message_num: 100
