[package]
name = "dora-ros2-bridge-arrow"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
description = "Apache Arrow conversion helpers for ROS2 messages in dora"
license.workspace = true
repository.workspace = true

[features]
default = ["ros2-humble"]
# Same distro chain as `dora-ros2-bridge`; `ros2-client` picks the `Gid`
# layout from the newest enabled distro feature, so the two crates stay in
# step even when only one of them is asked for a specific distro.
ros2-humble = ["ros2-client/humble"]
ros2-iron = ["ros2-client/iron"]
ros2-jazzy = ["ros2-client/jazzy"]
ros2-kilted = ["ros2-client/kilted"]

[dependencies]
dora-ros2-bridge-msg-gen = { workspace = true }
arrow = { workspace = true }
eyre = { workspace = true }
ros2-client = { workspace = true }
serde = { workspace = true }
cdr-encoding = { workspace = true }
byteorder = "1"

[dev-dependencies]
# CDR codec used by ros2-client 0.10 on the wire; used in tests to verify the
# real CDR byte layout (length prefixes, alignment) rather than just serde shape.
