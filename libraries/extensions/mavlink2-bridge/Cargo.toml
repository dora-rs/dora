[package]
name = "dora-mavlink2-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
documentation.workspace = true
readme.workspace = true
description = "MAVLink 2 bridge for dora-rs"

[dependencies]
mavlink = { workspace = true }
arrow = { workspace = true }
thiserror = { workspace = true }
num-traits = "0.2"
url = { workspace = true }
# Replays recorded `.tlog` files through `tlog://` endpoints. No further
# dependencies of its own.
mavlink-tlog = { version = "0.1.3", optional = true }

[features]
## `tlog:///path/flight.tlog?speed=1.0` endpoints that replay a recorded
## QGroundControl / Mission Planner / MAVProxy telemetry log.
tlog = ["dep:mavlink-tlog"]
