[package]
name = "dora-tensor-pool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
documentation.workspace = true
readme.workspace = true
description = "Daemon-side helper for the tensor-pool extension: reclaims orphaned /dev/shm segments. Not covered by dora's 1.0 compatibility guarantees — see libraries/extensions/tensor-pool/README.md."
license.workspace = true
repository.workspace = true
# Must be published: `dora-daemon` carries an (optional) `=1.0.0` dependency on
# this crate, and `cargo publish` resolves *every* path dependency against
# crates.io -- optional ones included, and `--no-verify` does not skip that
# resolution. Leaving it unpublished aborts the release run at `dora-daemon`,
# after the 16 crates before it are already live and unrecoverable (#3233).
# Publishing it does not make it public API; see README.md.

[features]
# The daemon half: mirror segments, the direct-TCP data plane, and the
# cross-machine control flow. Enabled by `dora-daemon`'s `tensor-pool`
# feature; off on its own so the node-side crate does not pull zenoh.
daemon = ["dep:zenoh", "dep:tokio", "dep:dora-core", "dep:eyre", "dep:shared_memory_extended", "dep:uuid", "dep:serde_json"]

[dependencies]
tracing = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true }
dora-message = { workspace = true }
zenoh = { workspace = true, optional = true }
tokio = { workspace = true, features = ["full"], optional = true }
dora-core = { workspace = true, features = ["zenoh"], optional = true }
eyre = { workspace = true, optional = true }
shared_memory_extended = { version = "0.13.0", optional = true }
uuid = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
