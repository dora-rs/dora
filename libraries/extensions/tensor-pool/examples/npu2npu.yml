# Single-machine Ascend NPU sender -> NPU receiver, cross-card (npu:0 -> npu:1).
# Same-card is examples/npu_inner.yml. Requires two visible NPUs, CANN, torch_npu.
nodes:
  - id: sender_node
    inputs:
      next_require: receiver_node/next_require
    outputs:
      - data
    path: sender.py
    env:
      sender_device: npu:0
      receiver_device: npu:1
      message_num: 100

  - id: receiver_node
    path: receiver.py
    inputs:
      data: sender_node/data
    outputs:
      - next_require
    env:
      sender_device: npu:0
      receiver_device: npu:1
      message_num: 100
