# Single-machine Ascend NPU sender -> NPU receiver, same card (npu:0 -> npu:0).
# Cross-card is examples/npu2npu.yml. Requires CANN and torch_npu.
nodes:
  - id: sender_node
    inputs:
      next_require: receiver_node/next_require
    outputs:
      - data
    path: sender.py
    env:
      sender_device: npu:0
      receiver_device: npu:0
      message_num: 100

  - id: receiver_node
    path: receiver.py
    inputs:
      data: sender_node/data
    outputs:
      - next_require
    env:
      sender_device: npu:0
      receiver_device: npu:0
      message_num: 100
