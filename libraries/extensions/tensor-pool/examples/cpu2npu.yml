# Single-machine CPU sender -> Ascend NPU receiver through torch_npu device IPC.
# Requires CANN 9.x and a torch_npu build with NPU storage IPC support.
env:
  sender_device: cpu
  receiver_device: npu
  message_num: 100
  tensor_pool_scenario: throughput
nodes:
  - id: sender_node
    path: sender.py
    inputs:
      next_require: receiver_node/next_require
    outputs:
      - data
  - id: receiver_node
    path: receiver.py
    inputs:
      latency: sender_node/data
    outputs:
      - next_require
