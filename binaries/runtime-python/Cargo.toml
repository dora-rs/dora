[package]
name = "dora-runtime-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
documentation.workspace = true
readme.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
publish = false  # PyO3 glue, not a crates.io API -- see below
# Links `pyo3`, and `pyo3-ffi` declares `links = "python"`, so cargo refuses
# two pyo3 versions in one build graph. Publishing this crate would therefore
# force any downstream that builds its own PyO3 extension onto dora's exact
# pyo3 minor, and freeze that minor for the life of 1.x. It reaches users
# compiled into the `dora-rs` wheel instead, where the pyo3 version is an
# implementation detail. Nothing published depends on it.

# Python (PyO3) operator runtime backend. Loads a Python module's `Operator`
# class and runs it on the `dora-runtime-api` event loop. Shipped inside the
# Python wheel and invoked via `dora.start_runtime()`. This is the only runtime
# crate that links `pyo3`.

[dependencies]
dora-runtime-api = { workspace = true }
# The wheel's runtime hosts shared-library operators too: an embedded-Python
# daemon routes native runtime nodes here (see this crate's module docs), which
# the pre-split `dora-runtime` handled because it compiled the shared-library
# backend in unconditionally.
dora-runtime-shared-lib = { workspace = true }
dora-node-api = { workspace = true, default-features = false, features = ["arrow-v59"] }
dora-core = { workspace = true }
dora-download = { workspace = true }
dora-operator-api-python = { workspace = true }
dora-operator-api-types = { workspace = true }
dora-tracing = { workspace = true, optional = true }
arrow = { workspace = true, features = ["pyarrow"] }
# pyo3-abi3 flag allow simpler linking. See: https://pyo3.rs/v0.13.2/building_and_distribution.html
pyo3 = { workspace = true, features = ["eyre"] }
pythonize = { workspace = true }
eyre = { workspace = true }
flume = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-opentelemetry = { version = "0.33.0", optional = true }

[build-dependencies]
# `use_pyo3_cfgs()` needs the interpreter config that `pyo3-ffi`'s build script
# resolves, which cargo forwards only to direct dependents of `pyo3`/`pyo3-ffi`
# — satisfied by the unconditional `pyo3` dependency above. In the old
# monolithic `dora-runtime` this had to be gated behind a `python` feature,
# because the crate was linked into `dora-cli` on machines with Python <= 3.10.
# This crate *is* the Python backend and always links pyo3.
pyo3-build-config = { workspace = true }

[dev-dependencies]
serde_yaml = { workspace = true }

[features]
default = ["tracing", "metrics"]
tracing = ["dora-runtime-api/tracing"]
metrics = ["dora-runtime-api/metrics"]
# Also turned on for the delegated shared-library backend, so native operators
# hosted by an embedded-Python daemon still export OTLP spans.
telemetry = [
    "tracing",
    "dora-runtime-shared-lib/telemetry",
    "dep:dora-tracing",
    "dep:tracing-opentelemetry",
]
