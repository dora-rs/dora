[package]
name = "dora-mavlink2-bridge-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "MAVLink 2 ↔ dora bridge node, daemon-spawnable"

[dependencies]
dora-mavlink2-bridge = { workspace = true }
dora-node-api = { workspace = true , features = ["arrow-v59"] }
flume = { workspace = true }
mavlink = { workspace = true }
arrow = { workspace = true }
url = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
eyre = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3"

# Outside the 1.x guarantee (docs/api-rust.md, "Stability scope at 1.0"):
# the Rust Semantic Review page shows its breaking changes as allowed.
[package.metadata.rust-semantic-review]
allow-breaking-changes = true
