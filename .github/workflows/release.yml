name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      # Pre-release tags (e.g. v1.0.0-rc.2). The bare pattern above does not
      # match a `-rc.N` suffix, which silently skipped the v1.0.0 rc releases.
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  # Manual re-run of a release that died partway. Select the release *tag*
  # as the ref — `check-version` refuses anything else. This replaces
  # cargo-release.yml, which carried a second copy of the publish list and
  # could only ever run this way: its `release: published` trigger is never
  # raised for a release created by a GITHUB_TOKEN action, which is how
  # every release here is created.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.97.1"
  # The workspace pins PyO3's abi3 floor to Python 3.11 (see pip-release.yml).
  PYTHON_VERSION: "3.11"

jobs:
  # ── 0. Fail fast if the tag doesn't match the workspace version ──────────
  # Guards against tag/version skew (the v1.0.0-rc.3 tag shipped rc.2
  # artifacts). Every job with an irreversible side effect gates on this;
  # the pure build jobs (`dist`, `c-cpp-libraries`) start immediately.
  check-version:
    name: Verify tag matches workspace version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare tag with workspace version
        run: |
          # workflow_dispatch can be pointed at a branch, where the checks
          # below would compare the workspace version against a branch name
          # and fail with a confusing message.
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::run this workflow against a release tag; got $GITHUB_REF_TYPE '$GITHUB_REF_NAME'"
            exit 1
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          # dora-cli inherits [workspace.package].version, so it stands in
          # for the workspace version here.
          crate_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "dora-cli") | .version')
          if [ "$tag_version" != "$crate_version" ]; then
            echo "::error::tag v$tag_version does not match workspace version $crate_version — bump [workspace.package].version before tagging"
            exit 1
          fi
          echo "tag v$tag_version matches workspace version"

  # ── 1. Publish Rust crates to crates.io ──────────────────────────────────
  publish-crates:
    name: Publish crates
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # Topological order: leaves first, binaries last. `cargo publish`
          # resolves path deps against crates.io, so every workspace dep of a
          # crate must be published before it — including optional deps
          # (dora-ros2-bridge before dora-node-api-cxx) and dev-deps, which
          # keep their version requirement when packaged (dora-daemon and
          # dora-cli before dora-ros2-bridge, which dev-depends on both).
          # Excludes `publish = false` binaries (dora-record-node,
          # dora-replay-node, dora-ros2-bridge-node — delivered via the CLI)
          # and the PyPI-only dora-node-api-python.
          CRATES=(
            dora-message
            dora-arrow-convert
            dora-coordinator-store
            dora-core
            dora-recording
            dora-download
            dora-tracing
            dora-metrics
            dora-hub-client
            dora-operator-api-types
            dora-operator-api-macros
            dora-operator-api
            dora-node-api
            dora-node-api-c
            dora-operator-api-c
            dora-coordinator
            dora-tensor-pool
            dora-daemon
            dora-runtime-api
            dora-runtime-shared-lib
            dora-cli
            dora-ros2-bridge-msg-gen
            dora-ros2-bridge
            dora-node-api-cxx
            dora-operator-api-cxx
            dora-ros2-bridge-arrow
          )
          # `cargo publish` blocks until the crate is available in the
          # index, so no propagation sleep is needed. Tolerate only
          # already-published versions (idempotent re-runs) and retry on
          # crates.io's new-crate rate limit (429, refills ~1 new crate per
          # 10 min after the initial burst); any other failure must fail the
          # job instead of silently producing a partial release.
          max_attempts=4
          backoff=630 # rate-limit window is 10 min, plus 30s slack
          for crate in "${CRATES[@]}"; do
            echo "::group::Publishing $crate"
            for attempt in $(seq 1 "$max_attempts"); do
              if output=$(cargo publish -p "$crate" --no-verify 2>&1); then
                echo "$output" | tail -5
                break
              fi
              echo "$output"
              if echo "$output" | grep -qi "already uploaded\|is already uploaded\|already exists"; then
                echo "::warning::$crate already published, skipping"
                break
              elif echo "$output" | grep -qi "429 Too Many Requests"; then
                if [ "$attempt" -eq "$max_attempts" ]; then
                  echo "::error::still rate limited publishing $crate after $attempt attempts"
                  exit 1
                fi
                echo "::warning::crates.io rate limit hit for $crate; retrying in ${backoff}s (attempt $attempt)"
                sleep "$backoff"
              else
                echo "::error::failed to publish $crate"
                exit 1
              fi
            done
            echo "::endgroup::"
          done

  # ── 2. Python wheels + sdists ─────────────────────────────────────────────
  # Delegated to pip-release.yml rather than rebuilt here. This job used to
  # carry its own 4-target matrix for `dora-rs` only, while pip-release.yml
  # carried the real 10-target matrix for `dora-rs` *and* `dora-rs-cli` —
  # and pip-release.yml only ran on `release: published`, which a
  # GITHUB_TOKEN-created release never raises. The result was a green
  # release that shipped 4 of 11 `dora-rs` files and no `dora-rs-cli` at
  # all (v1.0.0-rc.4). One matrix, one publisher, triggered by the tag.
  #
  # `needs: check-version` because this publishes: a tag/version mismatch
  # must fail before anything irreversible reaches PyPI.
  wheels:
    name: Python wheels
    needs: check-version
    uses: ./.github/workflows/pip-release.yml
    with:
      publish: true
    secrets:
      PYPI_PASS: ${{ secrets.PYPI_PASS }}

  # ── 3. Build the C/C++ libraries ──────────────────────────────────────────
  # Same story as the wheels: publish-c-cpp-libraries.yml only ever ran on
  # `release: published`, so none of its 8 archives reached the rc.3/rc.4
  # releases. Called here for the build; `github-release` below attaches the
  # artifacts, so the archives are part of the release from the moment it is
  # created rather than uploaded to it afterwards.
  c-cpp-libraries:
    name: C/C++ libraries
    uses: ./.github/workflows/publish-c-cpp-libraries.yml

  # ── 4. Build CLI binaries ─────────────────────────────────────────────────
  dist:
    name: Build CLI binaries (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin,      runner: macos-14     }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04 }
          - { target: x86_64-unknown-linux-gnu,  runner: ubuntu-22.04 }
          - { target: x86_64-pc-windows-msvc,    runner: windows-2022 }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cross-compilation tools (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build CLI for ${{ matrix.target }}
        run: cargo build -p dora-cli --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: Package binary (unix)
        if: runner.os != 'Windows'
        # Asset name and nested layout must match what install.sh expects
        # (dora-cli-<target>.tar.gz containing dora-cli-<target>/dora), which
        # is also the layout of previously published releases.
        run: |
          mkdir -p artifacts/dora-cli-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/dora artifacts/dora-cli-${{ matrix.target }}/dora
          tar czf artifacts/dora-cli-${{ matrix.target }}.tar.gz -C artifacts dora-cli-${{ matrix.target }}
      - name: Package binary (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Copy-Item "target/${{ matrix.target }}/release/dora.exe" "artifacts/dora.exe"
          # Flat zip (dora.exe at archive root) named dora-cli-<target>.zip,
          # matching install.ps1 and previously published releases.
          Compress-Archive -Path "artifacts/dora.exe" -DestinationPath "artifacts/dora-cli-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: artifacts/dora-cli-*.*

  # ── 5. Create GitHub Release with changelog ───────────────────────────────
  github-release:
    name: GitHub Release
    needs: [publish-crates, wheels, dist, c-cpp-libraries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: release-assets/
      # The C and C++ archives built above. `verify-release` fails the run if
      # any of the 8 is absent, so a silently-dropped target cannot ship.
      - uses: actions/download-artifact@v8
        with:
          pattern: dora-c*-libraries-*
          merge-multiple: true
          path: release-assets/
      - name: Copy install scripts to release assets
        run: |
          cp install.sh release-assets/dora-cli-installer.sh
          cp install.ps1 release-assets/dora-cli-installer.ps1
      - name: Generate changelog
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4.9.0
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.cliff.outputs.content }}
          files: release-assets/*

  # ── 6. Fail the release if anything is missing ────────────────────────────
  # The jobs above write to three different places, and nothing previously
  # checked that all of them landed. v1.0.0-rc.4 went green having published
  # 4 of 11 `dora-rs` files, no `dora-rs-cli`, and none of the 8 C/C++
  # archives. This reads back what is actually published and fails the run
  # naming whatever is absent, so an incomplete release is loud instead of
  # silent — whatever the cause. The *static* half (publish list vs. the
  # workspace manifests, and its ordering) is `make qa-publish-graph`, which
  # already runs in PR CI — a stale list fails there, before a tag exists.
  verify-release:
    name: Verify release is complete
    needs: [publish-crates, wheels, dist, c-cpp-libraries, github-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Verify every artifact was published
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/release/verify-release.py \
            --version "${GITHUB_REF_NAME#v}" \
            --repo "$GITHUB_REPOSITORY"
