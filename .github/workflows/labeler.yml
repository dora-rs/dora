name: "Issue Labeler"
on:
  issues:
    types: [opened, edited]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: github/issue-labeler@ccca1e16fcb66762200e616fc29b57b940c1cb67 # v3.1 (not the latest; pinned to preserve current behavior)
        with:
          repo-token: "${{ github.token }}"
          configuration-path: .github/labeler.yml
          enable-versioned-regex: 0
          include-title: 1
