name: Regenerate JSON schemas

on:
  push:
    branches: ["main"]

# One run at a time: this job reconciles a single piece of state (is there an
# open PR carrying the current schema?), and the newest run has the newest main
# and therefore the authoritative answer.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  regenerate_schemas:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: r7kamura/rust-problem-matchers@v1.5.1
      - run: cargo --version --verbose

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Update Schema
        run: cargo run -p dora-core --bin generate_schema
      - name: Open a schema-sync PR if the schema drifted
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Every generated file, including the repo-root `dora-schema.json` —
          # that is the copy the guide publishes as a `$schema` URL, so leaving
          # it out of these lists is what let it drift (#3088).
          SCHEMAS="dora-schema.json libraries/core/dora-schema.json libraries/core/dora-node-schema.json"
          if git diff --exit-code -- $SCHEMAS; then
              echo "Schema file is up to date"
              exit 0
          fi

          # Nothing below ever pushes to a branch that has an open PR: Trunk
          # evicts a PR from the merge queue the moment its head moves, failing
          # the batch it was in. The old scheme force-pushed one shared branch,
          # and its commit message embeds the triggering sha, so *every* push to
          # main minted a new head commit even when the regenerated bytes were
          # identical — leaving the sync PR mergeable only while the queue
          # happened to be empty.
          #
          # So the branch is named after the content it carries. The same drift
          # always maps to the same branch, so a re-run finds its own PR and
          # stops (that is what keeps #2262's one-PR-per-push spam fixed), and a
          # genuinely new drift gets a PR of its own rather than a force-push
          # onto the queued one.
          PREFIX="auto/schema-update"
          BRANCH="$PREFIX-$(sha256sum $SCHEMAS | sha256sum | cut -c1-12)"

          # Exact and server-side, so paging cannot hide it. This check alone
          # carries the never-push-to-an-open-PR invariant.
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
              echo "An open PR already carries this schema on $BRANCH; leaving it untouched"
              exit 0
          fi

          # Ask the same of the other sync PRs, which is what spots a PR opened
          # before this branch naming, or by hand. Its answer only decides
          # whether to duplicate a PR, but a wrong answer is still worth failing
          # over, so a fetch error is fatal rather than skipped. Fetching
          # `refs/pull/<n>/head` rather than the head branch name keeps that
          # stance affordable: it resolves on origin even for a fork PR, which
          # `origin <headRefName>` would not, so one fork PR sharing the prefix
          # cannot wedge schema sync red.
          OPEN_SYNC_PRS="$(gh pr list --state open --limit 200 --json number,headRefName \
              --jq ".[] | select(.headRefName | startswith(\"$PREFIX\")) | \"\(.number) \(.headRefName)\"")"

          while read -r number ref; do
              [ -n "$number" ] || continue
              git fetch --depth=1 origin "refs/pull/$number/head" </dev/null || {
                  echo "::error::cannot fetch PR #$number ($ref) — refusing to act on a half-known queue state"
                  exit 1
              }
              if git diff --quiet FETCH_HEAD -- $SCHEMAS; then
                  echo "PR #$number ($ref) already carries this schema; leaving it untouched"
                  exit 0
              fi
          done <<< "$OPEN_SYNC_PRS"

          # No open PR carries these bytes, and $BRANCH carries exactly these
          # bytes by construction, so $BRANCH has no open PR either. Anything at
          # that name is left over from a closed one, and overwriting it is both
          # safe and necessary — reusing it as-is would pin the new PR to a
          # stale base that may no longer merge.
          git config user.email "dora-bot@phil-opp.com"
          git config user.name "Dora Bot"
          git checkout -B "$BRANCH"
          git add $SCHEMAS
          git commit -m "Update JSON schema (${{ github.sha }})"
          git push --force origin "$BRANCH"

          BODY="The committed JSON schema drifted from \`cargo run -p dora-core --bin generate_schema\`. Merge to resync.

          The branch is named after the generated schema's content, so a re-run that produces the same bytes reuses this PR instead of pushing to it — a push would evict it from the Trunk merge queue and fail the whole batch."
          if [ -n "$OPEN_SYNC_PRS" ]; then
              BODY="$BODY

          Supersedes $(echo "$OPEN_SYNC_PRS" | awk '{ printf "%s#%s", (NR > 1 ? ", " : ""), $1 }')."
          fi
          URL="$(gh pr create --head "$BRANCH" --base main \
              --title "Update JSON schema for \`dora-core\`" \
              --body "$BODY")"
          echo "Opened $URL"

          # Those older sync PRs carry a stale copy now, so merging one would put
          # the wrong bytes on main. Say so on the PR rather than closing it:
          # closing evicts a queued PR exactly as pushing to it does, so the last
          # step is a human's. The marker follows the convention in
          # `trunk-merge-failure-notify.yml`, so these can be found later.
          for number in $(echo "$OPEN_SYNC_PRS" | cut -d' ' -f1); do
              gh pr comment "$number" --body "Superseded by $URL — the generated schema changed again, so this PR's copy is stale and merging it would put the wrong schema on \`main\`. Close this one in favour of the newer sync PR.
          <!-- schema-sync-superseded -->"
          done
