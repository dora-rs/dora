[package]
name = "dora-cli-api-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
documentation.workspace = true
readme.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
publish = false  # PyO3 cdylib, shipped via PyPI as `dora-rs-cli`, not crates.io

[features]
default = ["telemetry", "abi3"]
telemetry = ["dora-runtime-python/telemetry"]
# Build an abi3-py311 wheel: one `cp311-abi3` artifact loads on 3.11 and every
# later CPython. ON by default, so a normal build is configured exactly as it
# was before this feature existed. Turn it OFF (`--no-default-features`, plus
# the other defaults re-stated) to get a version-specific build — that is how
# the cp310 wheels in pip-release.yml are produced, and the only supported
# reason to do so. abi3 is what excludes 3.10: `abi3-py310` is not an
# alternative, because the buffer-protocol slots `send_output_raw` needs
# entered the STABLE C API only in 3.11 (#1833).
abi3 = ["pyo3/abi3-py311"]

[dependencies]
dora-cli = { workspace = true, features = ["python"] }
dora-runtime-python = { workspace = true, features = ["tracing", "metrics"] }
eyre = { workspace = true }
pyo3.workspace = true

[build-dependencies]
# Since 0.29, `pyo3-build-config` has no build script and no `abi3-*` features
# of its own: it reads the interpreter config resolved by `pyo3-ffi`, which
# cargo forwards only to direct dependents of `pyo3`/`pyo3-ffi` — satisfied by
# the `pyo3` dependency above. Inherit the workspace dep so the version stays
# in lockstep with `pyo3`.
pyo3-build-config.workspace = true

[dev-dependencies]
# `auto-initialize` lets the entry-point test start an interpreter so it can
# import the real module. Same pattern as `dora-ros2-bridge-python`.
pyo3 = { workspace = true, features = ["auto-initialize"] }
# Parses `[project.scripts]` out of pyproject.toml, same as the hub commands
# in `binaries/cli` do.
toml = "1.1"

[lib]
name = "dora_cli"
crate-type = ["cdylib"]
