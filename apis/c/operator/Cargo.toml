[package]
name = "dora-operator-api-c"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "C API implementation for Dora Operator"
documentation.workspace = true
readme.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["staticlib", "lib"]

[dependencies]
dora-operator-api-types = { workspace = true }

[build-dependencies]
dora-operator-api-types = { workspace = true }

# Outside the 1.x guarantee (docs/api-rust.md, "Stability scope at 1.0"):
# the Rust Semantic Review page shows its breaking changes as allowed.
[package.metadata.rust-semantic-review]
allow-breaking-changes = true
